<div class="admin-wrapper" [class.sidebar-collapsed]="isSidebarCollapsed">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <div class="brand-logo">
        <div class="brand-icon-box">
          <i class="bi bi-flower1"></i>
        </div>
        <div class="brand-text">
          <span class="brand-title">KrisiMarg</span>
          <span class="brand-badge">ADMIN PORTAL</span>
        </div>
      </div>
      <button class="toggle-btn d-md-none" (click)="toggleSidebar()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>




    <nav class="sidebar-nav">
      <div class="nav-section-title">MAIN NAVIGATION</div>

      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-item">
        <i class="bi bi-grid-1x2-fill nav-icon"></i>
        <span>Dashboard Widgets</span>
      </a>

      <a routerLink="/admin/categories" routerLinkActive="active" class="nav-item">
        <i class="bi bi-tags-fill nav-icon"></i>
        <span>Categories & Subs</span>
      </a>

      <a routerLink="/admin/crops" routerLinkActive="active" class="nav-item">
        <i class="bi bi-tree-fill nav-icon"></i>
        <span>Crops Listings</span>
      </a>

      <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
        <i class="bi bi-people-fill nav-icon"></i>
        <span>Farmers & Buyers</span>
      </a>

      <a routerLink="/admin/contact" routerLinkActive="active" class="nav-item">
        <i class="bi bi-envelope-paper-fill nav-icon"></i>
        <span>Contact Inquiries</span>
      </a>

      <a routerLink="/admin/news" routerLinkActive="active" class="nav-item">
        <i class="bi bi-newspaper nav-icon"></i>
        <span>News & Articles</span>
      </a>

      <a routerLink="/admin/mandi-rates" routerLinkActive="active" class="nav-item">
        <i class="bi bi-graph-up-arrow nav-icon"></i>
        <span>Daily Mandi Rates</span>
      </a>

      <div class="nav-section-title mt-4">SYSTEM</div>

      <a (click)="logout()" class="nav-item logout-item">
        <i class="bi bi-box-arrow-right nav-icon"></i>
        <span>Sign Out</span>
      </a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <div class="admin-main">
    <!-- Topbar Header -->
    <header class="admin-topbar">
      <div class="topbar-left">
        <button class="btn btn-icon me-3" (click)="toggleSidebar()">
          <i class="bi bi-list fs-5"></i>
        </button>

        <div class="live-status-pill">
          <span class="pulse-dot"></span>
          <span class="status-text">Backend Connected</span>
        </div>
      </div>

      <div class="topbar-right">
        <div class="system-clock me-3">
          <i class="bi bi-clock me-1 text-success"></i>
          <span>{{ currentTime | date:'mediumTime' }}</span>
        </div>

        <div class="dropdown">
          <button class="btn btn-user-menu dropdown-toggle d-flex align-items-center gap-2" type="button"
            data-bs-toggle="dropdown">
            <div class="avatar-sm">
              <i class="bi bi-person-fill"></i>
            </div>
            <span class="fw-semibold d-none d-sm-inline">{{ adminUser?.name || 'Admin User' }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0">
            <li><a class="dropdown-item" routerLink="/admin/dashboard"><i
                  class="bi bi-speedometer2 me-2 text-success"></i>Dashboard</a></li>
            <li><a class="dropdown-item" routerLink="/admin/categories"><i
                  class="bi bi-tags me-2 text-success"></i>Manage Categories</a></li>
            <li>
              <hr class="dropdown-divider">
            </li>
            <li><a class="dropdown-item text-danger" (click)="logout()"><i class="bi bi-box-arrow-right me-2"></i>Sign
                Out</a></li>
          </ul>
        </div>
      </div>
    </header>

    <!-- Page Body -->
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
