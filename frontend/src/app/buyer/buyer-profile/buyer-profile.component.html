<div class="buyer-profile-view animate-fade-in">
  <!-- Page Header -->
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div>
      <h3 class="fw-bold text-dark mb-1 d-flex align-items-center gap-2">
        <i class="bi bi-building text-primary"></i>
        Buyer Business Profile (व्यापारी प्रोफ़ाइल)
      </h3>
      <p class="text-muted mb-0">Manage wholesale business details, GSTIN, PAN, and address for trade invoices</p>
    </div>

    <button type="button" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" [disabled]="isSaving" (click)="onSaveProfile()" style="background-color: #1a365d; border-color: #1a365d;">
      @if (isSaving) {
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Saving...
      } @else {
        <i class="bi bi-check-circle-fill me-1"></i> Save Business Profile
      }
    </button>
  </div>

  <form (ngSubmit)="onSaveProfile()" #profileForm="ngForm">
    <div class="row g-4">
      
      <!-- Business & Contact Info Card -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 bg-white p-4 h-100">
          <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom d-flex align-items-center gap-2">
            <i class="bi bi-briefcase-fill"></i> Company & Contact Details
          </h5>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">Company / Firm Name <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-building"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" [(ngModel)]="profileData.companyName" name="companyName" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">Contact Person Name</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-fill"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" [(ngModel)]="profileData.name" name="name">
            </div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold text-secondary">Mobile Number <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-phone-fill"></i></span>
                <input type="tel" class="form-control border-start-0 ps-0" [(ngModel)]="profileData.mobile" name="mobile" maxlength="10" required>
              </div>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold text-secondary">Business Type</label>
              <select class="form-select" [(ngModel)]="profileData.businessType" name="businessType">
                <option value="Wholesaler / Bulk Buyer">Wholesaler / Bulk Buyer</option>
                <option value="Trader / Processor">Trader / Processor</option>
                <option value="Retail Chain">Retail Chain</option>
                <option value="Exporter">Exporter</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">Email Address</label>
            <input type="email" class="form-control" [(ngModel)]="profileData.email" name="email">
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">Business Street Address</label>
            <input type="text" class="form-control" [(ngModel)]="profileData.street" name="street">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold text-secondary">District <span class="text-danger">*</span></label>
              <input type="text" class="form-control" [(ngModel)]="profileData.district" name="district" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold text-secondary">State <span class="text-danger">*</span></label>
              <select class="form-select" [(ngModel)]="profileData.state" name="state" required>
                @for (st of statesList; track st) {
                  <option [value]="st">{{ st }}</option>
                }
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Statutory & Bank Info Card -->
      <div class="col-lg-6">
        <div class="card border-0 shadow-sm rounded-4 bg-white p-4 mb-4">
          <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom d-flex align-items-center gap-2">
            <i class="bi bi-file-earmark-check-fill"></i> Statutory & Registration Tax Details
          </h5>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">GSTIN Number</label>
            <input type="text" class="form-control" [(ngModel)]="profileData.gstNumber" name="gstNumber">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold text-secondary">PAN Number</label>
              <input type="text" class="form-control" [(ngModel)]="profileData.panNumber" name="panNumber">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold text-secondary">Trade License No</label>
              <input type="text" class="form-control" [(ngModel)]="profileData.tradeLicense" name="tradeLicense">
            </div>
          </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 bg-white p-4">
          <h5 class="fw-bold text-primary mb-3 pb-2 border-bottom d-flex align-items-center gap-2">
            <i class="bi bi-bank2"></i> Escrow Trade Bank Details
          </h5>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary">Account Holder Name</label>
            <input type="text" class="form-control" [(ngModel)]="profileData.bankHolder" name="bankHolder">
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold text-secondary">Account Number</label>
              <input type="text" class="form-control" [(ngModel)]="profileData.bankAccount" name="bankAccount">
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold text-secondary">IFSC Code</label>
              <input type="text" class="form-control" [(ngModel)]="profileData.bankIfsc" name="bankIfsc">
            </div>
          </div>
        </div>
      </div>

    </div>
  </form>
</div>
