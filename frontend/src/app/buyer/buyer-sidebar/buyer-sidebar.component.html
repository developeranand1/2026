<div class="buyer-layout-wrapper d-flex flex-column flex-md-row min-vh-100 bg-light">


  <aside class="buyer-sidebar bg-white border-end shadow-sm d-none d-md-flex flex-column justify-content-between"
    [class.collapsed]="isSidebarCollapsed">
    <div>
      <!-- Sidebar Header / Logo -->
      <div class="sidebar-header p-3 border-bottom d-flex align-items-center justify-content-between">
        <a routerLink="/buyer/dashboard"
          class="d-flex align-items-center gap-2 text-dark text-decoration-none overflow-hidden">
          <span
            class="logo-badge bg-warning text-dark rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm"
            style="width:38px; height:38px; flex-shrink:0;">
            <i class="bi bi-cart-fill fs-5"></i>
          </span>
          <div class="brand-text overflow-hidden" [class.d-none]="isSidebarCollapsed">
            <h5 class="fw-bold mb-0 text-dark-blue text-nowrap">GaonBazar</h5>
            <small class="text-muted text-nowrap" style="font-size: 11px;">Buyer Portal</small>
          </div>
        </a>
        <button type="button" class="btn btn-light btn-sm text-secondary p-1 border-0 fs-5 d-none d-lg-block"
          (click)="toggleSidebar()" title="Toggle Sidebar">
          <i class="bi" [class.bi-indent]="!isSidebarCollapsed" [class.bi-outdent]="isSidebarCollapsed"></i>
        </button>
      </div>


      <!-- Navigation Links -->
      <nav class="sidebar-nav p-2 mt-2">
        <ul class="nav nav-pills flex-column gap-1">
          <!-- Dashboard -->
          <li class="nav-item">
            <a routerLink="/buyer/dashboard" routerLinkActive="active-nav"
              class="nav-link text-dark d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 hover-light">
              <i class="bi bi-grid-1x2-fill fs-5 text-primary"></i>
              <span class="nav-text fw-semibold" [class.d-none]="isSidebarCollapsed">Marketplace Dashboard</span>
            </a>
          </li>

          <!-- Profile -->
          <li class="nav-item">
            <a routerLink="/buyer/profile" routerLinkActive="active-nav"
              class="nav-link text-dark d-flex align-items-center gap-3 px-3 py-2.5 rounded-3 hover-light">
              <i class="bi bi-person-lines-fill fs-5 text-warning"></i>
              <span class="nav-text fw-semibold" [class.d-none]="isSidebarCollapsed">Buyer Profile (प्रोफ़ाइल)</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>



  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="buyer-main-content flex-grow-1 bg-light d-flex flex-column pb-5 pb-md-0">


    <!-- ROUTED SUB-COMPONENT CONTENT (Dashboard / Profile) -->
    <div class="portal-body-content p-3 p-md-4 flex-grow-1">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- FIXED BOTTOM FOOTER NAVIGATION FOR MOBILE (Visible on Screens < 768px) -->
  <nav class="mobile-bottom-nav fixed-bottom bg-white border-top shadow-lg d-md-none py-2 px-3">
    <div class="d-flex justify-content-around align-items-center">

      <!-- Dashboard Tab -->
      <a routerLink="/buyer/dashboard" routerLinkActive="active-mobile-tab"
        class="mobile-nav-item text-center text-muted text-decoration-none d-flex flex-column align-items-center">
        <i class="bi bi-grid-1x2-fill fs-5 mb-1"></i>
        <span style="font-size: 11px;" class="fw-semibold">Marketplace</span>
      </a>

      <!-- Profile Tab -->
      <a routerLink="/buyer/profile" routerLinkActive="active-mobile-tab"
        class="mobile-nav-item text-center text-muted text-decoration-none d-flex flex-column align-items-center">
        <i class="bi bi-person-lines-fill fs-5 mb-1"></i>
        <span style="font-size: 11px;" class="fw-semibold">Profile</span>
      </a>

      <!-- Logout Tab -->
      <button type="button"
        class="mobile-nav-item border-0 bg-transparent text-center text-danger d-flex flex-column align-items-center p-0"
        (click)="logout()">
        <i class="bi bi-box-arrow-right fs-5 mb-1"></i>
        <span style="font-size: 11px;" class="fw-semibold">Logout</span>
      </button>

    </div>
  </nav>

</div>
