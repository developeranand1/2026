<section id="farmer" class="farmer-cta">
    <div class="container">

        <div class="row align-items-center g-4">

            <div class="col-lg-8">
                <span>
                    Become a Farming Partner
                </span>

                <h2>
                    Reach the Right Buyers and Get a Fair Price
                </h2>

                <p>
                    List your crops online, manage orders, and track your
                    earnings from a simple farmer dashboard.
                </p>
            </div>

            <div class="col-lg-4 text-lg-end">
                <a routerLink="/login" [queryParams]="{mode: 'register', role: 'farmer'}" class="btn btn-warning rounded-pill px-4">
                    Farmer Registration
                    <i class="bi bi-arrow-right ms-1"></i>
                </a>
            </div>

        </div>
    </div>
</section>
