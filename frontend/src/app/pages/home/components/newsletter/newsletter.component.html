<section class="newsletter-section">
    <div class="container">

        <div class="newsletter-box">

            <div>
                <span>Fresh Updates</span>

                <h3>
                    Get New Harvest and Offer Updates
                </h3>

                <p>
                    Receive new product arrivals, marketplace updates,
                    and special offers by email.
                </p>
            </div>

            <form class="newsletter-form" (submit)="$event.preventDefault()">
                <input type="email" placeholder="Enter your email address">

                <button type="submit">
                    Subscribe
                </button>
            </form>

        </div>
    </div>
</section>
